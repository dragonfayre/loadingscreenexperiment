<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Survey</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f5f5f5; }
    h1 { margin-bottom: 8px; }
    p { color: #555; margin-bottom: 32px; }
    input { padding: 10px 16px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 16px; width: 240px; }
    button { padding: 14px 36px; font-size: 16px; background: #2563eb; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <h1>Psychology of Design Survey</h1>
  <p>Click below to begin. This study is part of a UNSW comp2218 project.</p>
  <input id="name" type="text" placeholder="Your name" />
  <button onclick="if(document.getElementById('name').value.trim()) window.location='/loading?name='+encodeURIComponent(document.getElementById('name').value.trim()); else alert('Please enter your name.')">Start Survey</button>
</body>
</html>
